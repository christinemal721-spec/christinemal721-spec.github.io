<style>
/* Layout: one full-bleed stage; the scene is a canvas, ink captions float in the fog at the lower left, a four-point rail sits at the foot. */
:root{
  --fog:#e4eaed;
  --fog-low:#d9dcdd;
  --ink:#2b2f31;
  --ink-soft:#5d6669;
  --seal:#9a3b2c;
  --rail:rgba(43,47,49,.22);
  --display:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --body:"Noto Serif SC","Songti SC","SimSun",serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(var(--fog),var(--fog-low));color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none;cursor:crosshair}
canvas{display:block;width:100%;height:100%}
.caption{
  position:absolute;
  left:max(28px,calc(env(safe-area-inset-left,0px) + 20px));
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  pointer-events:none;
  display:grid;
}
.cap{grid-area:1/1;display:flex;align-items:flex-end;gap:18px;opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease}
.cap.on{opacity:1;transform:none}
.cap .char{font-family:var(--display);font-size:clamp(64px,9vw,120px);line-height:.9;color:var(--ink)}
.cap .meta{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.cap .term{font-size:12px;letter-spacing:.32em;color:var(--seal)}
.cap .line{font-size:clamp(15px,1.5vw,19px);letter-spacing:.18em;color:var(--ink)}
.cap .src{font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
.rail{
  position:absolute;left:0;right:0;
  bottom:calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(28px,calc(env(safe-area-inset-left,0px) + 20px));
  padding-right:max(28px,calc(env(safe-area-inset-right,0px) + 20px));
}
.track{position:relative;height:28px}
.track::before{content:"";position:absolute;left:12.5%;right:12.5%;top:50%;height:1px;background:var(--rail)}
.mark{position:absolute;top:0;transform:translateX(-50%);height:28px;display:flex;align-items:center;justify-content:center;width:44px;
  background:none;border:0;font-family:var(--body);font-size:14px;letter-spacing:.1em;color:var(--ink-soft);cursor:pointer}
.mark span{background:var(--fog-low);padding:0 6px;transition:color .4s}
.mark.on span{color:var(--seal);font-weight:600}
.mark:focus-visible{outline:1px solid var(--seal);outline-offset:2px}
.dot{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--seal);pointer-events:none}
.hint{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  font-size:13px;letter-spacing:.4em;color:var(--ink-soft);pointer-events:none;transition:opacity 1.2s;white-space:nowrap}
.hint.gone{opacity:0}
@media (max-width:600px){
  .cap .char{font-size:64px}
  .caption{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
</style>

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const caps = [...document.querySelectorAll('.cap')], marks = [...document.querySelectorAll('.mark')];

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const mix=(a,b,t)=>a+(b-a)*t;
function softRect(x,y,x0,x1,y0,y1,e){return ss(x0-e,x0+e,x)*(1-ss(x1-e,x1+e,x))*ss(y0-e,y0+e,y)*(1-ss(y1-e,y1+e,y));}

// Season recipes: atmosphere tint, window duotone, sun colour, foliage colour.
const S=[
 {atm:[1.01,1.005,0.99], sh:[50,72,60],  hi:[228,238,222], k:.5,  gam:1,   sun:[252,196,196], fol:[244,176,192], folK:1, branch:0},
 {atm:[0.985,1.01,1.0],  sh:[26,60,52],  hi:[196,228,212], k:.62, gam:1.08,sun:[255,226,170], fol:[86,140,78],   folK:1, branch:0},
 {atm:[1.035,1.0,0.94],  sh:[80,50,30],  hi:[240,212,168], k:.62, gam:1,   sun:[238,120,62],  fol:[214,104,42],  folK:1, branch:0},
 {atm:[0.97,0.995,1.04], sh:[74,84,96],  hi:[248,250,253], k:.7,  gam:.62, sun:[236,238,242], fol:[240,244,248], folK:.95,branch:.35}
];

function build(img){
  IW=img.naturalWidth; IH=img.naturalHeight;
  const base=document.createElement('canvas'); base.width=IW; base.height=IH;
  const bx=base.getContext('2d'); bx.drawImage(img,0,0);
  const src=bx.getImageData(0,0,IW,IH).data;
  const sx=IW/1169, sy=IH/683;
  // per-pixel masks
  const n=IW*IH, mWin=new Float32Array(n), mSun=new Float32Array(n), mFol=new Float32Array(n), mLum=new Float32Array(n);
  for(let y=0;y<IH;y++)for(let x=0;x<IW;x++){
    const i=y*IW+x, p=i*4, r=src[p],g=src[p+1],b=src[p+2];
    const X=x/sx, Y=y/sy, lum=.299*r+.587*g+.114*b, warm=r-b;
    mLum[i]=lum;
    let w=Math.max(softRect(X,Y,262,952,219,481,3),softRect(X,Y,172,252,232,481,3),softRect(X,Y,962,1046,222,481,3));
    w*=mix(1,ss(70,125,lum),1-ss(410,455,X));    // keep the foreground tree out of the window grade
    mWin[i]=w;
    const d=Math.hypot(X-601,Y-318);
    mSun[i]=w*ss(8,40,warm)*ss(150,200,lum)*(1-ss(70,95,d));
    // foliage: warm pale clusters on the tree, outside the window panel interior
    const inTree=(1-ss(440,480,X))*(1-ss(470,520,Y));
    mFol[i]=inTree*ss(3,26,warm)*ss(55,115,lum)*(1-mSun[i]);
  }
  layers=S.map(s=>{
    const c=document.createElement('canvas'); c.width=IW; c.height=IH;
    const cx=c.getContext('2d'), id=cx.createImageData(IW,IH), o=id.data;
    for(let i=0;i<n;i++){
      const p=i*4; let r=src[p]*s.atm[0], g=src[p+1]*s.atm[1], b=src[p+2]*s.atm[2];
      const w=mWin[i];
      if(w>0){
        let t=clamp(mLum[i]/240,0,1); t=Math.pow(t,s.gam);
        const k=s.k*w;
        r=mix(r,mix(s.sh[0],s.hi[0],t),k); g=mix(g,mix(s.sh[1],s.hi[1],t),k); b=mix(b,mix(s.sh[2],s.hi[2],t),k);
        const sw=mSun[i]*.92;
        if(sw>0){r=mix(r,s.sun[0],sw);g=mix(g,s.sun[1],sw);b=mix(b,s.sun[2],sw);}
      }
      const f=mFol[i]*s.folK;
      if(f>0){
        const sh=clamp(mLum[i]/185,.55,1.12);
        r=mix(r,s.fol[0]*sh,f); g=mix(g,s.fol[1]*sh,f); b=mix(b,s.fol[2]*sh,f);
      }
      o[p]=r;o[p+1]=g;o[p+2]=b;o[p+3]=255;
    }
    cx.putImageData(id,0,0);
    return c;
  });
}

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!IW) return;
  let s=Math.max(W/IW,H/IH);
  if(W/H<1.2) s=Math.min(s,(W/IW)*2.1);          // portrait: keep the window in frame
  view.s=s;
  const fx=(W<700?604:584)/1169*IW;                // focus on the window's centre
  view.ox=clamp(W/2-fx*s, W-IW*s, 0);
  if(IW*s<W) view.ox=(W-IW*s)/2;
  view.oy=(H-IH*s)/2;
  if(IH*s>H) view.oy=clamp(H*.46-IH*.52*s, H-IH*s, 0);
}

// ---- particles -------------------------------------------------------
const rnd=(a,b)=>a+Math.random()*(b-a);
const pools=[[],[],[],[]];
function seed(){
  const k=reduce?.35:1, area=Math.max(.5,W*H/(1200*700));
  const cnt=[70,120,46,150].map(c=>Math.round(c*k*area));
  for(let si=0;si<4;si++){pools[si]=[];for(let j=0;j<cnt[si];j++)pools[si].push(spawn(si,true));}
}
function spawn(si,any){
  const y=any?rnd(-20,H):rnd(-60,-10);
  if(si===0) return {x:rnd(-80,W),y,vx:rnd(18,42),vy:rnd(14,34),r:rnd(3,6),a:rnd(0,6.28),va:rnd(-2,2),ph:rnd(0,6.28),hue:Math.random()};
  if(si===1) return {x:rnd(-100,W+60),y,len:rnd(14,30),v:rnd(420,640),al:rnd(.12,.3)};
  if(si===2) return {x:rnd(-80,W),y,vx:rnd(10,40),vy:rnd(30,60),r:rnd(5,9),a:rnd(0,6.28),va:rnd(-3,3),ph:rnd(0,6.28),c:Math.floor(rnd(0,3))};
  return {x:rnd(-40,W+40),y,r:rnd(1,3.2),vy:rnd(18,48),ph:rnd(0,6.28),sw:rnd(10,30)};
}
const leafC=['#c4622a','#d88b32','#a8432a'];
function stepDraw(dt,t,wts){
  for(let si=0;si<4;si++){
    const w=wts[si]; const pool=pools[si];
    for(const q of pool){
      if(si===0){q.x+=(q.vx+Math.sin(t*1.3+q.ph)*14)*dt;q.y+=q.vy*dt;q.a+=q.va*dt;}
      else if(si===1){q.x-=q.v*.18*dt;q.y+=q.v*dt;}
      else if(si===2){q.x+=(q.vx+Math.sin(t*1.1+q.ph)*30)*dt;q.y+=q.vy*dt;q.a+=q.va*dt;}
      else{q.y+=q.vy*dt;q.x+=Math.sin(t*.8+q.ph)*q.sw*dt;}
      if(q.y>H+40||q.x>W+100||q.x<-140) Object.assign(q,spawn(si,false));
    }
    if(w<.01) continue;
    ctx.save();
    if(si===0){
      for(const q of pool){
        ctx.globalAlpha=w*.85;
        ctx.fillStyle=q.hue<.6?'#f2b8c6':'#fbe3e8';
        ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.a);ctx.scale(1,.55+.35*Math.sin(t*3+q.ph));
        ctx.beginPath();ctx.ellipse(0,0,q.r,q.r*.62,0,0,6.283);ctx.fill();ctx.restore();
      }
    }else if(si===1){
      ctx.strokeStyle='#6d8590';ctx.lineWidth=1;ctx.lineCap='round';
      for(const q of pool){ctx.globalAlpha=w*q.al;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x+q.len*.18,q.y-q.len);ctx.stroke();}
    }else if(si===2){
      for(const q of pool){
        ctx.globalAlpha=w*.9;ctx.fillStyle=leafC[q.c];
        ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.a);ctx.scale(Math.cos(t*2+q.ph),1);
        ctx.beginPath();ctx.moveTo(0,-q.r);ctx.quadraticCurveTo(q.r*.8,0,0,q.r);ctx.quadraticCurveTo(-q.r*.8,0,0,-q.r);ctx.fill();ctx.restore();
      }
    }else{
      ctx.fillStyle='#ffffff';
      for(const q of pool){ctx.globalAlpha=w*(.55+q.r/7);ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.fill();}
    }
    ctx.restore();
  }
}

// ---- input -----------------------------------------------------------
function setFromX(x){
  const u=clamp(x/W*4-.5,0,3), i=Math.min(2,Math.floor(u)), f=u-i;
  target=u>=3?3:i+ss(.18,.82,f);
}
const stage=document.getElementById('stage');
let moved=false;
stage.addEventListener('pointermove',e=>{
  if(e.target.closest('.mark')) return;
  setFromX(e.clientX);
  if(!moved){moved=true;hint.classList.add('gone');}
});
stage.addEventListener('pointerdown',e=>{ if(!e.target.closest('.mark')) setFromX(e.clientX); });
marks.forEach(m=>m.addEventListener('click',()=>{target=+m.dataset.i;moved=true;hint.classList.add('gone');}));
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')target=Math.min(3,Math.round(target)+1);
  if(e.key==='ArrowLeft')target=Math.max(0,Math.round(target)-1);
});
addEventListener('resize',()=>{resize();seed();});

// ---- loop ------------------------------------------------------------
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  cur+= (target-cur)*(1-Math.exp(-dt*(reduce?9:3.2)));
  if(Math.abs(target-cur)<1e-4) cur=target;
  ctx.fillStyle='#e2e8eb';ctx.fillRect(0,0,W,H);
  if(layers.length){
    const i=Math.min(2,Math.floor(cur)), f=cur-i;
    ctx.imageSmoothingQuality='high';
    const dw=IW*view.s, dh=IH*view.s;
    ctx.globalAlpha=1; ctx.drawImage(layers[i],view.ox,view.oy,dw,dh);
    if(f>0){ctx.globalAlpha=f; ctx.drawImage(layers[i+1],view.ox,view.oy,dw,dh);}
    ctx.globalAlpha=1;
  }
  const wts=[0,1,2,3].map(k=>clamp(1-Math.abs(cur-k)*1.25,0,1));
  stepDraw(dt,now/1000,wts);
  const r=Math.round(cur);
  if(r!==shown){shown=r;caps.forEach((c,k)=>c.classList.toggle('on',k===r));marks.forEach((m,k)=>m.classList.toggle('on',k===r));}
  dot.style.left=(12.5+cur*25)+'%';
  requestAnimationFrame(frame);
}

const img=new Image();
img.onload=()=>{build(img);resize();seed();};
img.src=SRC;
resize();seed();
requestAnimationFrame(frame);
})();
</script>
